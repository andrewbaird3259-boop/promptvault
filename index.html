<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#0d0e12">
<meta name="description" content="灵感库 PromptVault — 本地优先的提示词与图片收藏夹，一键复制、变量填充、离线可用。">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>灵感库 · PromptVault</title>
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/styles.css?v=10">
</head>
<body>

<!-- ============ 顶栏 ============ -->
<header class="topbar">
  <button class="icon-btn only-mobile" id="btnMenu" aria-label="菜单">
    <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>

  <a class="brand" href="#" id="brandHome">
    <span class="brand-mark">✦</span>
    <span class="brand-text">灵感库<em>PromptVault</em></span>
  </a>

  <div class="search">
    <svg class="s-ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    <input id="search" type="text" placeholder="搜索提示词 / 标签 / 图片…" autocomplete="off" spellcheck="false" enterkeyhint="search">
    <kbd class="only-desktop">Ctrl K</kbd>
    <button class="s-clear" id="searchClear" aria-label="清空" hidden>
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>

  <div class="top-actions">
    <button class="icon-btn only-desktop" id="btnTheme" title="切换主题">
      <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
    </button>
    <button class="btn primary only-desktop" id="btnNew">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>新建</span>
    </button>
    <button class="icon-btn only-mobile" id="btnInstall" title="安装到手机" hidden>
      <svg viewBox="0 0 24 24"><path d="M12 4v10m0 0l-4-4m4 4l4-4"/><path d="M5 18v2h14v-2"/></svg>
    </button>
  </div>
</header>

<div class="app">
  <!-- ============ 侧栏（桌面） ============ -->
  <aside class="sidebar" id="sidebar">
    <nav class="nav" id="viewNav">
      <button class="nav-item" data-view="prompts">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        <span>提示词</span><b id="cPrompts">0</b>
      </button>
      <button class="nav-item" data-view="images">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg>
        <span>图片库</span><b id="cImages">0</b>
      </button>
      <button class="nav-item" data-view="fav">
        <svg viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 3.9.9 5.6-4.9-2.7-4.9 2.7.9-5.6-4-3.9 5.5-.8z"/></svg>
        <span>收藏</span><b id="cFav">0</b>
      </button>
      <button class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>设置</span>
      </button>
    </nav>

    <div class="side-block" id="catBlock">
      <h4>分类</h4>
      <div class="chips" id="catList"></div>
    </div>
    <div class="side-block" id="tagBlock">
      <h4>标签</h4>
      <div class="chips" id="tagList"></div>
    </div>
    <div class="side-foot" id="sideFoot"></div>
  </aside>

  <!-- ============ 主区 ============ -->
  <main class="main" id="main">
    <div class="main-head">
      <div class="mh-title">
        <h1 id="viewTitle">提示词</h1>
        <p id="viewSub">全部收藏</p>
      </div>
      <div class="head-tools">
        <button class="icon-btn" id="btnSort" title="排序">
          <svg viewBox="0 0 24 24"><path d="M7 4v16m0 0l-3-3m3 3l3-3M17 20V4m0 0l-3 3m3-3l3 3"/></svg>
        </button>
        <button class="icon-btn" id="btnLayout" title="切换视图">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        </button>
      </div>
    </div>

    <div class="filterbar" id="filterBar"></div>

    <div id="content" class="content"></div>
  </main>
</div>

<!-- ============ 底部标签栏（手机） ============ -->
<nav class="tabbar" id="tabbar">
  <button data-view="prompts" class="tab active">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg><span>提示词</span>
  </button>
  <button data-view="images" class="tab">
    <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 17l5-5 4 4 3-3 4 4"/></svg><span>图片</span>
  </button>
  <button data-view="fav" class="tab">
    <svg viewBox="0 0 24 24"><path d="M12 4l2.5 5.2 5.5.8-4 3.9.9 5.6-4.9-2.7-4.9 2.7.9-5.6-4-3.9 5.5-.8z"/></svg><span>收藏</span>
  </button>
  <button data-view="settings" class="tab">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M4.2 4.2l1.4 1.4m12.8 12.8l1.4 1.4M3 12h2m14 0h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg><span>设置</span>
  </button>
</nav>

<button class="fab only-mobile" id="fab" aria-label="新建">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<!-- ============ 浮层 ============ -->
<div class="modal-root" id="modalRoot" hidden></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="drop-overlay" id="dropOverlay" hidden>
  <div class="drop-inner">
    <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5l5 5"/><path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>
    <p>松手即可添加到图片库</p>
  </div>
</div>

<input type="file" id="pickImages" accept="image/*" multiple hidden>
<input type="file" id="pickJson" accept="application/json,.json" hidden>

<script src="assets/samples.js?v=10"></script>
<script src="assets/app.js?v=10"></script>
</body>
</html>
